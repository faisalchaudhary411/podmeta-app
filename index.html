<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Free Podcast MP3 Tag Editor Online - Edit ID3 Tags & Cover Art</title>
  <meta name="description" content="Edit podcast MP3 ID3 tags and embed cover art directly in your browser." />
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-2">
        <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center font-bold text-white text-lg">P</div>
        <span class="font-bold text-lg text-white tracking-tight">PodMeta<span class="text-indigo-400">.tools</span></span>
      </a>
      <a href="#tool" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-4 py-2 rounded-lg transition-colors shadow">Edit MP3 Now</a>
    </div>
  </header>

  <main class="flex-grow">
    <section id="tool" class="py-12 px-4 max-w-4xl mx-auto space-y-8">
      <div class="text-center space-y-3">
        <span class="bg-indigo-900/60 text-indigo-300 text-xs font-semibold px-3 py-1 rounded-full border border-indigo-700/50">100% Free & Browser-Based</span>
        <h1 class="text-3xl md:text-5xl font-extrabold text-white tracking-tight">Podcast MP3 ID3 Tag Editor</h1>
        <p class="text-slate-400 text-sm md:text-base max-w-xl mx-auto">Auto-read existing metadata, embed cover art, preview audio, and download tagged MP3s instantly.</p>
      </div>

      <div class="bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-6 md:p-8 space-y-6">
        
        <div class="space-y-2">
          <div class="flex justify-between items-center">
            <label class="block text-sm font-semibold text-slate-200">1. Select or Drag MP3 File(s)</label>
            <span id="fileCount" class="text-xs text-indigo-400 font-semibold hidden">0 files selected</span>
          </div>
          <div id="dropZone" class="border-2 border-dashed border-slate-600 hover:border-indigo-500 bg-slate-900/60 rounded-xl p-8 text-center cursor-pointer transition-all flex flex-col items-center justify-center group">
            <svg class="w-12 h-12 text-slate-500 group-hover:text-indigo-400 transition-colors mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
            </svg>
            <p class="text-sm text-slate-300"><span class="font-semibold text-indigo-400">Click to upload</span> or drag and drop files here</p>
            <input type="file" id="mp3Files" accept="audio/mpeg, audio/mp3, audio/x-mp3, .mp3" multiple class="hidden" />
          </div>
        </div>

        <div id="audioPlayerContainer" class="hidden space-y-2 bg-slate-900/80 p-4 rounded-xl border border-slate-700">
          <div class="flex justify-between items-center">
            <label class="block text-xs font-semibold text-indigo-400">Audio Preview</label>
            <span id="audioFileName" class="text-xs text-slate-400 truncate max-w-[250px]"></span>
          </div>
          <audio id="audioPlayer" controls class="w-full h-10 rounded focus:outline-none"></audio>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Episode Title (`TIT2`)</label>
            <input type="text" id="title" placeholder="Launching website" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Host Name (`TPE1`)</label>
            <input type="text" id="artist" placeholder="Faisal Aslam" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Show Title (`TALB`)</label>
            <input type="text" id="album" placeholder="The Web Journey" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Year (`TYER`)</label>
            <input type="number" id="year" placeholder="2026" value="2026" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500" />
          </div>
        </div>

        <div class="space-y-2">
          <label class="block text-sm font-semibold text-slate-200">2. Cover Art Image (`APIC`)</label>
          <div class="flex items-center gap-4">
            <input type="file" id="coverImage" accept="image/jpeg, image/png" class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-slate-700 file:text-white hover:file:bg-slate-600 cursor-pointer bg-slate-900 border border-slate-700 rounded-lg p-2" />
            <img id="preview" class="w-14 h-14 rounded-lg object-cover border border-slate-700 hidden" alt="Cover Preview" />
          </div>
        </div>

        <button id="processBtn" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 font-bold text-white rounded-xl transition-colors shadow-lg flex items-center justify-center text-base">
          <span id="btnText">Tag & Download MP3</span>
        </button>
      </div>
    </section>
  </main>

  <footer class="border-t border-slate-800 bg-slate-950 py-8 px-4 text-xs text-slate-500 text-center">
    <p class="font-semibold text-slate-400">PodMeta.tools &copy; 2026 — Free Client-Side Utility</p>
  </footer>

  <script>
    // Pure JS Strict ID3v2.3 Engine (Strips legacy headers & writes compliant frames)
    class ID3v23Engine {
      static stripExistingID3(uint8Array) {
        let offset = 0;
        while (offset + 10 <= uint8Array.length && 
               uint8Array[offset] === 0x49 && 
               uint8Array[offset+1] === 0x44 && 
               uint8Array[offset+2] === 0x33) {
          
          const tagSize = ((uint8Array[offset + 6] & 0x7f) << 21) |
                          ((uint8Array[offset + 7] & 0x7f) << 14) |
                          ((uint8Array[offset + 8] & 0x7f) << 7) |
                          (uint8Array[offset + 9] & 0x7f);
          
          offset += 10 + tagSize;
        }
        return uint8Array.subarray(offset);
      }

      static encodeTextISO(str) {
        const bytes = new Uint8Array(str.length);
        for (let i = 0; i < str.length; i++) {
          bytes[i] = str.charCodeAt(i) & 0xFF;
        }
        return bytes;
      }

      static createFrame(id, payload) {
        const frame = new Uint8Array(10 + payload.length);
        for (let i = 0; i < 4; i++) frame[i] = id.charCodeAt(i);
        
        const len = payload.length;
        frame[4] = (len >>> 24) & 0xFF;
        frame[5] = (len >>> 16) & 0xFF;
        frame[6] = (len >>> 8) & 0xFF;
        frame[7] = len & 0xFF;
        
        frame[8] = 0x00; // Flags
        frame[9] = 0x00;
        
        frame.set(payload, 10);
        return frame;
      }

      static createTextFrame(id, text) {
        if (!text) return null;
        const textBytes = this.encodeTextISO(String(text));
        const payload = new Uint8Array(1 + textBytes.length);
        payload[0] = 0x00; // ISO-8859-1 Encoding
        payload.set(textBytes, 1);
        return this.createFrame(id, payload);
      }

      static createAPICFrame(imageBuffer) {
        if (!imageBuffer) return null;
        const imgBytes = new Uint8Array(imageBuffer);
        
        let mime = 'image/jpeg';
        if (imgBytes[0] === 0x89 && imgBytes[1] === 0x50 && imgBytes[2] === 0x4E && imgBytes[3] === 0x47) {
          mime = 'image/png';
        }
        
        const mimeBytes = this.encodeTextISO(mime);
        const payloadLen = 1 + mimeBytes.length + 1 + 1 + 1 + imgBytes.length;
        const payload = new Uint8Array(payloadLen);
        
        let p = 0;
        payload[p++] = 0x00; // ISO-8859-1
        payload.set(mimeBytes, p); p += mimeBytes.length;
        payload[p++] = 0x00; // Null MIME terminator
        payload[p++] = 0x03; // Front Cover
        payload[p++] = 0x00; // Null Description
        payload.set(imgBytes, p);

        return this.createFrame('APIC', payload);
      }

      static buildTaggedMP3(rawAudioArrayBuffer, tags) {
        const cleanAudioBytes = this.stripExistingID3(new Uint8Array(rawAudioArrayBuffer));
        const frames = [];

        if (tags.title) frames.push(this.createTextFrame('TIT2', tags.title));
        if (tags.artist) frames.push(this.createTextFrame('TPE1', tags.artist));
        if (tags.album) frames.push(this.createTextFrame('TALB', tags.album));
        if (tags.year) frames.push(this.createTextFrame('TYER', tags.year));
        frames.push(this.createTextFrame('TCON', 'Podcast'));

        if (tags.coverBuffer) {
          const apic = this.createAPICFrame(tags.coverBuffer);
          if (apic) frames.push(apic);
        }

        const validFrames = frames.filter(f => f !== null);
        const framesTotalSize = validFrames.reduce((acc, f) => acc + f.length, 0);
        
        const paddingSize = 1024; // Standard ID3v2 padding
        const tagContentSize = framesTotalSize + paddingSize;

        const header = new Uint8Array(10);
        header[0] = 0x49; header[1] = 0x44; header[2] = 0x33; // 'ID3'
        header[3] = 0x03; header[4] = 0x00; // v2.3.0
        header[5] = 0x00; // Flags

        // Synchsafe Tag Size
        header[6] = (tagContentSize >> 21) & 0x7F;
        header[7] = (tagContentSize >> 14) & 0x7F;
        header[8] = (tagContentSize >> 7) & 0x7F;
        header[9] = tagContentSize & 0x7F;

        const tagBuffer = new Uint8Array(10 + tagContentSize);
        tagBuffer.set(header, 0);
        
        let offset = 10;
        for (const f of validFrames) {
          tagBuffer.set(f, offset);
          offset += f.length;
        }

        const finalFile = new Uint8Array(tagBuffer.length + cleanAudioBytes.length);
        finalFile.set(tagBuffer, 0);
        finalFile.set(cleanAudioBytes, tagBuffer.length);

        return new Blob([finalFile], { type: 'audio/mpeg' });
      }
    }

    // UI Operations
    const dropZone = document.getElementById('dropZone');
    const mp3Input = document.getElementById('mp3Files');
    const coverInput = document.getElementById('coverImage');
    const previewImg = document.getElementById('preview');
    const processBtn = document.getElementById('processBtn');
    const btnText = document.getElementById('btnText');
    const fileCount = document.getElementById('fileCount');
    const audioPlayerContainer = document.getElementById('audioPlayerContainer');
    const audioPlayer = document.getElementById('audioPlayer');
    const audioFileName = document.getElementById('audioFileName');

    let loadedFiles = [];
    let newCoverBuffer = null;

    function isMp3File(file) {
      if (!file) return false;
      const nameLower = file.name ? file.name.toLowerCase() : '';
      const typeLower = file.type ? file.type.toLowerCase() : '';
      return nameLower.endsWith('.mp3') || typeLower.includes('mpeg') || typeLower.includes('mp3') || typeLower === 'audio/x-mp3';
    }

    dropZone.addEventListener('click', () => mp3Input.click());

    ['dragenter', 'dragover'].forEach(name => {
      dropZone.addEventListener(name, (e) => {
        e.preventDefault(); e.stopPropagation();
        dropZone.classList.add('border-indigo-500', 'bg-slate-800');
      }, false);
    });

    ['dragleave', 'drop'].forEach(name => {
      dropZone.addEventListener(name, (e) => {
        e.preventDefault(); e.stopPropagation();
        dropZone.classList.remove('border-indigo-500', 'bg-slate-800');
      }, false);
    });

    dropZone.addEventListener('drop', (e) => {
      const droppedFiles = Array.from(e.dataTransfer.files).filter(isMp3File);
      if (droppedFiles.length) handleFiles(droppedFiles);
      else alert('Please drop valid .mp3 audio files.');
    });

    mp3Input.addEventListener('change', (e) => {
      const selectedFiles = Array.from(e.target.files).filter(isMp3File);
      if (selectedFiles.length) handleFiles(selectedFiles);
    });

    function handleFiles(files) {
      loadedFiles = files;
      fileCount.innerText = `${files.length} file(s) loaded`;
      fileCount.classList.remove('hidden');

      const primaryFile = files[0];
      audioPlayer.src = URL.createObjectURL(primaryFile);
      audioFileName.innerText = primaryFile.name;
      audioPlayerContainer.classList.remove('hidden');

      if (window.jsmediatags) {
        window.jsmediatags.read(primaryFile, {
          onSuccess: (tag) => {
            const tags = tag.tags;
            if (tags.title) document.getElementById('title').value = tags.title;
            if (tags.artist) document.getElementById('artist').value = tags.artist;
            if (tags.album) document.getElementById('album').value = tags.album;
            if (tags.year) document.getElementById('year').value = tags.year;

            if (tags.picture && !coverInput.files[0]) {
              const { data, format } = tags.picture;
              let base64String = "";
              for (let i = 0; i < data.length; i++) base64String += String.fromCharCode(data[i]);
              previewImg.src = `data:${format};base64,${window.btoa(base64String)}`;
              previewImg.classList.remove('hidden');
            }
          },
          onError: (err) => console.log('No tags found:', err)
        });
      }
    }

    coverInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (file) {
        previewImg.src = URL.createObjectURL(file);
        previewImg.classList.remove('hidden');
        newCoverBuffer = await file.arrayBuffer();
      }
    });

    processBtn.addEventListener('click', async () => {
      if (!loadedFiles.length) {
        alert('Please select at least one MP3 file.');
        return;
      }

      btnText.innerText = 'Processing Metadata...';
      processBtn.disabled = true;

      try {
        const title = document.getElementById('title').value;
        const artist = document.getElementById('artist').value;
        const album = document.getElementById('album').value;
        const year = document.getElementById('year').value;

        const zip = (window.JSZip && loadedFiles.length > 1) ? new JSZip() : null;
        const isSingle = loadedFiles.length === 1;

        for (let i = 0; i < loadedFiles.length; i++) {
          const file = loadedFiles[i];
          const mp3Buffer = await file.arrayBuffer();

          const taggedBlob = ID3v23Engine.buildTaggedMP3(mp3Buffer, {
            title: loadedFiles.length > 1 ? `${title} (${i + 1})` : title,
            artist,
            album,
            year,
            coverBuffer: newCoverBuffer
          });

          if (isSingle) {
            const taggedUrl = URL.createObjectURL(taggedBlob);
            const a = document.createElement('a');
            a.href = taggedUrl;
            a.download = `tagged_${file.name}`;
            a.click();
          } else if (zip) {
            zip.file(`tagged_${file.name}`, taggedBlob);
          }
        }

        if (!isSingle && zip) {
          btnText.innerText = 'Compressing ZIP...';
          const zipContent = await zip.generateAsync({ type: 'blob' });
          const zipUrl = URL.createObjectURL(zipContent);
          const a = document.createElement('a');
          a.href = zipUrl;
          a.download = 'podcast_episodes_tagged.zip';
          a.click();
        }

      } catch (err) {
        alert('Error writing metadata: ' + err.message);
      } finally {
        btnText.innerText = 'Tag & Download MP3';
        processBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
